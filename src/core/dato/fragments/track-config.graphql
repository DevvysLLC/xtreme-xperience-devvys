fragment TrackConfig on TrackConfigRecord {
  id
  title
  handle
  seo {
    title
    description
    image {
      ...Image
    }
    noIndex
    twitterCard
  }
  # Note: Uncomment these fields once they have been added to the Track Config model in DatoCMS:
  # enableCampaignStickyBar
  # campaignStickyBarHeading
  # campaignStickyBarTimerEnd
  # campaignStickyBarCtaTitle
  # campaignStickyBarCtaLink
}
