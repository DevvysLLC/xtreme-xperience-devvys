query getBookingConfig {
  bookingConfig {
    ...BookingConfig
  }
  allPromotions(filter: { active: { eq: true } }) {
    id
    name
    active
    startDate
    endDate
    badgeLabel
    dateBadgeBackgroundColor {
      hex
    }
    dateBadgeTextColor {
      hex
    }
    cardBadgeBackgroundColor {
      hex
    }
    cardBadgeTextColor {
      hex
    }
    headline
    rules {
      ...BookingDiscountRule
    }
  }
}
