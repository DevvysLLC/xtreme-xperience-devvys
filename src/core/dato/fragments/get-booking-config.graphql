query getBookingConfig {
  bookingConfig {
    ...BookingConfig
  }
  allPromotions(filter: { active: { eq: true } }) {
    id
    name
    active
    startDate
    endDate
    badgeLabel
    badgeBackgroundColor {
      hex
    }
    badgeTextColor {
      hex
    }
    headline
    rules {
      ...BookingDiscountRule
    }
  }
}
