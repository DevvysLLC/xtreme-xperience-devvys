fragment BookingPage on BookingPageRecord {
  id
  key
  title
  description
}

fragment BookingSupercar on BookingSupercarRecord {
  rocketRezSeatTypeId
  rocketRezSeatTypeIdOverrides {
    event {
      model {
        rocketRezId
      }
    }
    rocketRezSeatTypeId
  }
  titleOverride
  cartLineItemLabel
  isMulticar
  isRideAlong
  multicarCount
  hideLapSelection
  thumbnailOverride {
    ...CoreImage
  }
  badgeOverride {
    ...CoreBadge
  }
  priceOverride {
    ...CorePrice
  }
  supercar {
    ...SupercarBase
  }
  whatsIncludedLeadOverride
  whatsIncludedDescriptionOverride
  whatsIncludedNoticeOverride
}

fragment BookingSupercarGroup on BookingSupercarGroupRecord {
  title
  supercars {
    ...BookingSupercar
  }
}

fragment EventOverride on BookingEventOverrideRecord {
  event {
    id
  }
  lapsPerSession
  quantityTitleThreeLaps
  quantityLabelThreeLaps
  quantityTitleSixLaps
  quantityLabelSixLaps
  quantityTitleNineLaps
  quantityLabelNineLaps
}

fragment BookingDiscountRule on BookingDiscountRuleRecord {
  id
  title
  discountType
  discountValue
  timeWindow
  startTime
  endTime
  applyToAllEvents
  badgeLabel
  dateBadgeBackgroundColor {
    hex
  }
  dateBadgeTextColor {
    hex
  }
  cardBadgeBackgroundColor {
    hex
  }
  cardBadgeTextColor {
    hex
  }
  compareAtOverride
  daysOfWeek
  targetType
  excludedTracks {
    id
  }
  events {
    id
  }
  supercars {
    id
  }
  packages {
    id
  }
  addons {
    id
  }
}

fragment BookingConfig on BookingConfigRecord {
  id
  showBackLink
  showGiftCards
  selectCarButtonLabel
  removeCarButtonLabel
  addToCartErrorMessage
  addToCartSuccessMessage
  quantityLabelThreeLaps
  quantityLabelSixLaps
  quantityLabelNineLaps
  backLink {
    ...CoreCta
  }
  pages {
    ...BookingPage
  }
  supercars {
    ...BookingSupercarGroup
  }
  insurance {
    ...Insurance
  }
  rideAlong {
    ...Addon
  }
  addons {
    ...Addon
  }
  upsellsTitle
  upsellsDescription
  upsell {
    ...Addon
  }
  reservedCart
  bookingAnnouncement {
    ...SectionAnnouncementBar
  }
  cancellationPolicy
  legalNotice
  orderCompleteNotice
  eventOverrides {
    ...EventOverride
  }
  whatsIncludedLead
  whatsIncludedDescription
  whatsIncludedNotice
}
